<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>완료</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #e2e2e3;
            background: #141414;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .thank-you-title {
            font-size: 2.5rem;
            color: #28a745;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .thank-you-subtitle {
            font-size: 1.2rem;
            color: #e2e2e3;
            text-align: center;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="thank-you-title">
        감사합니다!
    </div>
    <div class="thank-you-subtitle">
        해당 창을 끄셔도 됩니다.
    </div>
</body>
</html>
